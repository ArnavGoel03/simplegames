<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A glass table seen from above: a pane with two pieces on it.

    Two pieces rather than three, and a heavy rim rather than a thin one,
    because this has to survive 16 pixels. At that size a stroke under about
    2 units disappears and a third piece turns the middle to mush. The indigo
    is --indigo from globals.css, the one accent the site has, written out
    because a static file cannot read a custom property.

    The animated version of the same mark is src/components/StudioMark.tsx,
    where the pane's shadows sit underneath the glass. A favicon cannot afford
    that much detail, so here the rim carries the meaning on its own.
  -->
  <rect width="32" height="32" rx="7" fill="#3b3bd0" />
  <rect
    x="6.5"
    y="6.5"
    width="19"
    height="19"
    rx="4"
    fill="#ffffff"
    fill-opacity="0.18"
    stroke="#ffffff"
    stroke-opacity="0.6"
    stroke-width="2"
  />
  <circle cx="12.6" cy="19.4" r="2.9" fill="#ffffff" />
  <circle cx="19.4" cy="12.6" r="2.9" fill="#ffffff" />
</svg>
