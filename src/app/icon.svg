<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A die face showing three, on the diagonal.

    Chosen because it survives 16 pixels: three solid pips on a solid ground
    read as dice at any size, where a wordmark or an outlined shape turns to
    mush. The indigo is --indigo from globals.css, the one accent the site has.
  -->
  <rect width="32" height="32" rx="7" fill="#3b3bd0" />
  <circle cx="9" cy="23" r="3" fill="#ffffff" />
  <circle cx="16" cy="16" r="3" fill="#ffffff" />
  <circle cx="23" cy="9" r="3" fill="#ffffff" />
</svg>
