name: Visual review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Capture the public studio and game homepages
        type: boolean
        default: false
      casino_preview:
        description: Optional Casino version URL on the studio Workers account
        type: string
      browser:
        description: Browser engine
        type: choice
        options:
          - chromium
          - webkit
        default: chromium

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}-${{ inputs.browser || 'chromium' }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: npx playwright install --with-deps "$BROWSER_ENGINE"
      - if: ${{ !inputs.live && !inputs.casino_preview }}
        run: npm run build
      - name: Verify startup recovery under failed and stalled resources
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-startup.mjs
      - name: Capture responsive pages
        env:
          CAPTURE_LIVE: ${{ inputs.live }}
          CASINO_PREVIEW: ${{ inputs.casino_preview }}
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: |
          if [ "$CAPTURE_LIVE" = "true" ] || [ -n "$CASINO_PREVIEW" ]; then
            node tools/verify-visual.mjs --live
          else
            node tools/verify-visual.mjs
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: visual-review
          path: .audit/visual
          retention-days: 7
