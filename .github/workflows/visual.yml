name: Visual review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Capture the public studio and game homepages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - if: ${{ !inputs.live }}
        run: npm run build
      - name: Capture responsive pages
        env:
          CAPTURE_LIVE: ${{ inputs.live }}
        run: |
          if [ "$CAPTURE_LIVE" = "true" ]; then
            node tools/verify-visual.mjs --live
          else
            node tools/verify-visual.mjs
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: visual-review
          path: .audit/visual
          retention-days: 7
