name: Visual review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Capture the public studio and game homepages
        type: boolean
        default: false
      casino_preview:
        description: Optional Casino version URL on the studio Workers account
        type: string
      browser:
        description: Browser engine
        type: choice
        options:
          - chromium
          - webkit
        default: chromium
      baseline:
        description: Measure the existing live sites without creating release evidence
        type: boolean
        default: false
      release_candidates_json:
        description: Exact candidate upload receipts to verify
        type: string
      controls_only:
        description: Run focused modal and Casino controls verification
        type: boolean
        default: false
      network_probe_only:
        description: Run only the bounded network diagnostic controls
        type: boolean
        default: false
      skip_performance_probe:
        description: Skip the independent performance probe during network diagnosis
        type: boolean
        default: false
      site_filter:
        description: Optional studio-only live baseline
        type: string

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}-${{ inputs.browser || 'chromium' }}-${{ inputs.controls_only && 'controls' || inputs.network_probe_only && 'probe' || 'release' }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASELINE_ONLY: ${{ inputs.baseline }}
      RELEASE_CANDIDATES_JSON: ${{ inputs.release_candidates_json }}
      SITE_FILTER: ${{ inputs.site_filter }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run gate
      - name: Install browser
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: npx playwright install --with-deps "$BROWSER_ENGINE"
      - if: ${{ !inputs.controls_only && !inputs.live && !inputs.casino_preview && !inputs.baseline && !inputs.release_candidates_json }}
        run: npm run build
      - name: Verify usable game controls
        if: ${{ inputs.controls_only || (!inputs.network_probe_only && contains(fromJSON(inputs.release_candidates_json || '[]').*.site, 'teenpatti')) }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-controls.mjs
      - name: Capture responsive pages
        if: ${{ !inputs.controls_only && !inputs.network_probe_only && !cancelled() }}
        env:
          CAPTURE_LIVE: ${{ inputs.live }}
          CASINO_PREVIEW: ${{ inputs.casino_preview }}
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: |
          if [ "$CAPTURE_LIVE" = "true" ] || [ "$BASELINE_ONLY" = "true" ] || [ -n "$CASINO_PREVIEW" ] || [ -n "$RELEASE_CANDIDATES_JSON" ]; then
            node tools/verify-visual.mjs --live
          else
            node tools/verify-visual.mjs
          fi
      - name: Verify startup recovery under failed and stalled resources
        if: ${{ !inputs.controls_only && !inputs.network_probe_only && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-startup.mjs
      - name: Verify game entry
        if: ${{ !inputs.controls_only && inputs.release_candidates_json && !inputs.network_probe_only && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-entry.mjs
      - name: Verify gameplay across resize
        if: ${{ !inputs.controls_only && inputs.release_candidates_json && !inputs.network_probe_only && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-play.mjs
      - name: Verify service worker lifecycle
        if: ${{ !inputs.controls_only && inputs.release_candidates_json && !inputs.network_probe_only && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-pwa.mjs
      - name: Calibrate browser network diagnostics
        if: ${{ !inputs.controls_only && inputs.release_candidates_json && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
          TRACE_CASINO: ${{ inputs.network_probe_only }}
        run: |
          if [ "$TRACE_CASINO" = "true" ]; then
            node tools/probe-network.mjs --trace-casino
          else
            node tools/probe-network.mjs
          fi
      - name: Inspect Prize Wheel rendering
        if: ${{ !inputs.controls_only && !inputs.network_probe_only && inputs.release_candidates_json && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/probe-wheel.mjs
      - name: Compare live and candidate performance
        if: ${{ !inputs.controls_only && inputs.network_probe_only && !inputs.skip_performance_probe && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/probe-performance.mjs
      - name: Verify synthetic player history with candidate styles
        if: ${{ contains(fromJSON(inputs.release_candidates_json || '[]').*.site, 'board') && !inputs.controls_only && !inputs.network_probe_only && !cancelled() }}
        env:
          BROWSER_ENGINE: ${{ inputs.browser || 'chromium' }}
        run: node tools/verify-player-history.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: visual-review
          path: .audit/visual
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.baseline && !inputs.controls_only && !inputs.network_probe_only && success()
        with:
          name: performance-baseline
          path: .audit/visual/release-evidence.json
          retention-days: 90
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.release_candidates_json && !inputs.controls_only && !inputs.network_probe_only && success()
        with:
          name: candidate-evidence
          path: .audit/visual/release-evidence.json
          retention-days: 90
